[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-crm-python-backend"
version = "0.1.0"
description = "Educational Python adaptation of the CRM/task backend from the Go project."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<0.36",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.16,<1.17",
    "black>=25.1,<26.0",
    "sqladmin>=0.24,<0.25",
    "itsdangerous>=2.2,<3.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "PyJWT>=2.10,<3.0",
    "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=1.18,<2.0",
    "pre-commit>=4.3,<5.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.2,<2.0",
    "ruff>=0.13,<0.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.alembic]
script_location = "alembic"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
files = ["app/core", "app/repositories", "app/services", "tests"]
python_version = "3.14"
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
